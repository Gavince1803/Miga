# Agregar un ingrediente nuevo desde Inventario, con capturas del teclado
# abierto en cada campo. Crea datos reales en la cuenta con sesión iniciada.
appId: com.agendarepostera.app
---
- launchApp
- extendedWaitUntil:
    visible: "Tu día de hoy"
    timeout: 20000
- tapOn: "Inventario, tab.*"
- extendedWaitUntil:
    notVisible: "Cargando..."
    timeout: 15000
- takeScreenshot: capturas/ing-01-lista
- tapOn:
    point: "87%,84%"          # botón flotante "+"
- extendedWaitUntil:
    visible: "Nuevo Ingrediente"
    timeout: 10000
- takeScreenshot: capturas/ing-02-formulario
# Cada campo se toca por su etiqueta (below:): los placeholders ("General",
# "1", "5") se repiten en pestañas montadas detrás, y las posiciones cambian
# cuando el formulario se desplaza con el teclado.
- tapOn:
    below: "Nombre \\*"
- inputText: "Harina de prueba Maestro"
- takeScreenshot: capturas/ing-03-nombre-teclado
- tapOn:
    below: "Categoría"
- inputText: "Secos"
- takeScreenshot: capturas/ing-04-categoria-teclado
- tapOn:
    below: "Cantidad"
- inputText: "2,5"
- takeScreenshot: capturas/ing-05-cantidad-teclado
- tapOn:
    point: "71%,47%"          # Pagué ($): "below" encuentra primero Cantidad, que está al lado
- inputText: "4,20"
- takeScreenshot: capturas/ing-06-precio-teclado
- swipe:                      # queda detrás del teclado: deslizar como haría una persona
    start: "50%,40%"
    end: "50%,20%"
- tapOn:
    below: "Stock mínimo \\(alerta\\)"
- inputText: "1"
- takeScreenshot: capturas/ing-07-minimo-teclado
- tapOn:
    point: "88%,61%"          # "Listo" (la barra vive en la ventana del teclado; no aparece en el árbol)
- takeScreenshot: capturas/ing-08-antes-de-guardar
- tapOn: ".*Agregar Ingrediente"   # el texto incluye el glifo del ícono
- takeScreenshot: capturas/ing-09-despues-de-guardar
